name: LectureFlow HW5 Browser QA
on:
  push:
    branches:
      - hw5/javascript-dom-20261109
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Run LectureFlow in local HTTP server and test
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hw5-http.log 2>&1 &
          sleep 2
          node tests/hw5-browser.mjs
      - name: Prepare MP4 version of real browser demo
        if: success()
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -y -hide_banner -loglevel error -i evidence/hw5_generated/hw5_demo.webm -c:v libx264 -preset veryfast -crf 25 -pix_fmt yuv420p -movflags +faststart evidence/hw5_generated/hw5_demo.mp4
          else
            echo "ffmpeg unavailable, keeping original WebM demo"
          fi
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lectureflow-hw5-browser-qa
          path: evidence/hw5_generated/
          if-no-files-found: warn
      - name: Upload complete source files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lectureflow-hw5-source
          path: |
            index.html
            README.md
            css/
            js/
            data/
            assets/
            ai-log.md
            HW5_SUBMISSION.md
            tests/
            evidence/HW5_QA.md
            .github/workflows/hw5-qa.yml
          include-hidden-files: true
          if-no-files-found: error

name: LectureFlow HW5 Browser QA
on:
  push:
    branches:
      - hw5/javascript-dom-20261109
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Run LectureFlow in local HTTP server and test
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hw5-http.log 2>&1 &
          sleep 2
          node tests/hw5-browser.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lectureflow-hw5-browser-qa
          path: evidence/hw5_generated/
          if-no-files-found: warn
